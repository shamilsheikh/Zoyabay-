<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Zoya 💙</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:linear-gradient(135deg,#000000,#02152f,#0b3d91,#000000);
display:flex;
justify-content:center;
align-items:center;
position:relative;
color:white;
}

.stars{
position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
opacity:.35;
animation:twinkle 4s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2;}
to{opacity:.7;}
}

.card{
position:relative;
z-index:10;
background:rgba(0,0,0,.45);
backdrop-filter:blur(12px);
padding:40px;
border-radius:25px;
text-align:center;
max-width:600px;
box-shadow:0 0 30px #1e90ff;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
50%{
transform:translateY(-10px);
}
}

h1{
font-size:3rem;
color:#7ec8ff;
text-shadow:0 0 20px #2196f3;
margin-bottom:20px;
}

p{
font-size:1.2rem;
line-height:1.8;
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
background:#2196f3;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 20px #4fc3f7;
}

.signature{
margin-top:25px;
font-size:18px;
color:#9bd8ff;
}

.flower{
position:fixed;
top:-60px;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(115vh) rotate(720deg);
opacity:0.9;
}
}

#magicMessage{
position:fixed;
top:18%;
left:50%;
transform:translateX(-50%);
font-size:34px;
font-weight:bold;
color:#8fd3ff;
text-shadow:0 0 25px #2196f3;
z-index:1000;
display:none;
animation:fade 4s forwards;
}

@keyframes fade{
0%{
opacity:0;
transform:translateX(-50%) scale(.5);
}
20%{
opacity:1;
transform:translateX(-50%) scale(1.1);
}
80%{
opacity:1;
}
100%{
opacity:0;
transform:translateX(-50%) scale(.8);
}
}
</style>

</head>

<body>

<div class="stars"></div>

<div class="card">

<h1>🎂 Happy Birthday Zoya 💙</h1>

<p>
May every dream you have come true.<br>
May your smile always shine brighter than the stars.<br><br>

Wishing you endless happiness, love, laughter and success.
You deserve the most beautiful life.
💙✨
</p>

<button onclick="celebrate()">
✨ Click for Magic ✨
</button>

<div class="signature">
Made with ❤️ by <b>Shamil</b>
</div>

</div>

<div id="magicMessage">
🎉 Happy Birthday, Zoya! 💙
</div>

<script>

const emojis=[
"🌹","🌸","🌺","🌼","💙","✨"
];

function createFlower(){

const flower=document.createElement("div");

flower.className="flower";

flower.innerHTML=
emojis[Math.floor(Math.random()*emojis.length)];
flower.style.left=Math.random()*100+"vw";

flower.style.fontSize=
(20+Math.random()*25)+"px";

flower.style.animationDuration=
(4+Math.random()*3)+"s";

document.body.appendChild(flower);

setTimeout(()=>{
flower.remove();
},7000);

}

// Continuous flower shower
setInterval(createFlower,250);

function celebrate(){

// Big flower burst
for(let i=0;i<180;i++){

setTimeout(()=>{
createFlower();
},i*20);

}

// Show message
const msg=document.getElementById("magicMessage");

msg.style.display="block";

msg.style.animation="none";

void msg.offsetWidth;

msg.style.animation="fade 4s forwards";

setTimeout(()=>{
msg.style.display="none";
},4000);

}

</script>

</body>
</html>
